name: Atualiza dados da planilha mestra

# Le a BASE MESTRA pela API do Google Sheets, roda o mesmo transformador que usamos
# a mao, e so publica se o portao de validacao aprovar. Se a planilha estiver com
# problema, o job FALHA e o site continua servindo o ultimo dado bom.

on:
  schedule:
    # Seis janelas por dia, de segunda a sexta. O horario do cron e UTC; Fortaleza
    # e UTC-3. Minutos quebrados e diferentes entre si de proposito: a hora cheia e
    # a meia hora sao os horarios mais disputados nos runners gratuitos, e espalhar
    # os minutos evita que as seis concorram no mesmo instante da fila.
    #
    #   UTC      Fortaleza   para que serve
    #   08:07  ->  05:07     dado pronto antes de qualquer um chegar
    #   12:23  ->  09:23     inicio do expediente
    #   16:41  ->  13:41     volta do almoco
    #   18:19  ->  15:19     meio da tarde
    #   21:37  ->  18:37     fim do expediente
    #   23:11  ->  20:11     fecha o dia com o que foi lancado ate tarde
    - cron: '7 8 * * 1-5'
    - cron: '23 12 * * 1-5'
    - cron: '41 16 * * 1-5'
    - cron: '19 18 * * 1-5'
    - cron: '37 21 * * 1-5'
    - cron: '11 23 * * 1-5'
  # Para atualizar na hora, sem esperar a proxima janela, por ordem de facilidade:
  #
  #   1. Aba Actions do repositorio -> "Atualiza dados da planilha mestra" ->
  #      botao "Run workflow" -> Branch: main -> "Run workflow". Leva ~40 s.
  #      E o unico caminho que nao precisa de nada instalado.
  #   2. gh workflow run atualiza-dados.yml --repo climatizacao-sme-fortaleza/Portal-da-climatiza-o
  #      Exige "gh auth login" feito antes, nessa maquina.
  #   3. Empurrar qualquer mudanca em tools/importa_mestra.py ou neste arquivo:
  #      cai no gatilho de push abaixo e recarrega. Serve de quebra-galho, mas
  #      suja o historico com commit que existe so para disparar — evite.
  workflow_dispatch:        # botao "Run workflow" para atualizar na hora
  push:
    # mexeu no transformador ou nas regras? recarrega e revalida na hora, sem esperar
    # a proxima janela. NAO inclui web/data aqui, senao o commit do proprio robo
    # dispararia outra execucao em loop.
    branches: [main]
    paths:
      - 'tools/importa_mestra.py'
      - '.github/workflows/atualiza-dados.yml'

# uma execucao por vez: duas cargas simultaneas brigariam pelo mesmo push
concurrency:
  group: atualiza-dados
  cancel-in-progress: false

permissions:
  contents: write

env:
  # id da planilha mestra (esta na URL dela). Nao e segredo: quem controla o acesso
  # e o compartilhamento da planilha com a conta de servico.
  PLANILHA_ID: 1PtlPiyra_wcgurnsdsM4XQUcXpEuQ5xq5vieXfxMVFk

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # o subtree push precisa do historico inteiro

      - name: Conferir se a credencial esta configurada
        env:
          CRED: ${{ secrets.GOOGLE_SHEETS_CREDENCIAL }}
        run: |
          if [ -z "$CRED" ]; then
            echo "::error::Falta o secret GOOGLE_SHEETS_CREDENCIAL. Veja tools/ROBO.md."
            exit 1
          fi

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install --quiet google-auth requests

      - name: Ler a planilha, validar e gravar
        env:
          GOOGLE_SHEETS_CREDENCIAL: ${{ secrets.GOOGLE_SHEETS_CREDENCIAL }}
          PYTHONIOENCODING: utf-8
        run: python tools/importa_mestra.py --sheet "$PLANILHA_ID" web/data --gravar

      - name: Ver se algum dado mudou
        id: mudou
        run: |
          # o carimbo muda toda execucao; aqui olhamos so os arquivos de DADO,
          # para a mensagem do commit dizer a verdade sobre o que aconteceu
          if git diff --quiet -- web/data/dados.js web/data/subestacao.js \
                                 web/data/mapa_sub.js web/data/salas_prof.js; then
            echo "houve=nao" >> "$GITHUB_OUTPUT"
            echo "Nenhuma mudanca nos dados - so o carimbo de verificacao."
          else
            echo "houve=sim" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- web/data
          fi

      # Commita SEMPRE que a leitura passou na validacao, mesmo sem mudanca de dado:
      # o carimbo do rodape e a hora da ULTIMA VERIFICACAO, e so tem valor se for
      # atualizado toda vez. Sem isso, robo saudavel e planilha parada davam a
      # impressao de robo travado.
      - name: Commitar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if [ "${{ steps.mudou.outputs.houve }}" = "sim" ]; then
            ASSUNTO="Atualiza dados da planilha mestra"
            CORPO="Carga automatica lida da BASE MESTRA e aprovada no portao de validacao."
          else
            ASSUNTO="Verificacao da planilha mestra (sem mudanca)"
            CORPO="Leitura aprovada na validacao. Nenhum dado diferente; so o carimbo de verificacao."
          fi
          git commit -m "$ASSUNTO

          $CORPO

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          git push origin HEAD:main

      - name: Publicar no site
        run: git subtree push --prefix web origin gh-pages

      # Em 06/10/2026 o branch gh-pages recebeu o dado das 15:28 e o site continuou
      # servindo o das 12:04 por quase uma hora: o push funcionou e o build do Pages
      # nao rodou. Nada no robo acusava — ele dava tudo verde. Quem descobriu foi o
      # Igor abrindo o site numa aba anonima.
      #
      # Este passo confere o que o site ENTREGA, nao o que o branch guarda. Avisa e
      # nunca falha: lag de Pages e comum e um job vermelho aqui viraria e-mail de
      # erro a cada hiccup, o que ensina a ignorar e-mail de erro.
      - name: Conferir se o site publicou mesmo
        if: always()
        continue-on-error: true
        run: |
          ESPERADO=$(grep -o '"iso": "[^"]*"' web/data/atualizado.js | cut -d'"' -f4)
          URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data/atualizado.js"
          echo "esperado no site: $ESPERADO"
          echo "conferindo: $URL"
          for tentativa in 1 2 3 4 5 6; do
            SERVIDO=$(curl -fsS --max-time 20 "$URL?v=$(date +%s)" 2>/dev/null \
                      | grep -o '"iso": "[^"]*"' | cut -d'"' -f4 || true)
            if [ "$SERVIDO" = "$ESPERADO" ]; then
              echo "ok: o site ja serve $SERVIDO (tentativa $tentativa)"
              echo "Site publicado e conferido: \`$SERVIDO\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "  tentativa $tentativa: site ainda em '${SERVIDO:-vazio}', esperando 30 s"
            sleep 30
          done
          echo "::warning title=Pages nao publicou::O branch gh-pages tem $ESPERADO mas o site ainda serve '${SERVIDO:-vazio}' depois de 3 min. O push funcionou; o build do Pages e que nao saiu. Olhe a aba Actions, workflow 'pages build and deployment'."
          {
            echo "### Atencao: o site nao refletiu a publicacao"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| esperado (branch gh-pages) | \`$ESPERADO\` |"
            echo "| servido pelo site | \`${SERVIDO:-vazio}\` |"
            echo ""
            echo "O \`subtree push\` funcionou. Quem nao rodou foi o build do Pages."
            echo "Confira o workflow **pages build and deployment** na aba Actions."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resumo
        if: always()
        run: |
          if [ "${{ steps.mudou.outputs.houve }}" = "sim" ]; then
            echo "### Dados atualizados e publicados" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Verificado, sem mudanca nos dados" >> "$GITHUB_STEP_SUMMARY"
          fi
